# Generated by scripts/play-site.mjs (android workflow, `site` job). Do not edit:
# every publish replaces this branch. The site is already built, so Netlify
# only publishes it (no install, no build).
[build]
  publish = "."
  command = "echo The play branch is a prebuilt site: nothing to build."

[[headers]]
  for = "/app/overclock.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"overclock.apk\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/overclock-main-20261126-1525-b155.1.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"overclock-main-20261126-1525-b155.1.apk\""
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/latest.json"
  [headers.values]
    Cache-Control = "no-cache"
