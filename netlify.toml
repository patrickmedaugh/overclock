# Netlify site "overcloc". Sprint 15 (S-15-5): the play link
# https://overcloc.netlify.app is Netlify's production branch `play`, a
# prebuilt site (web game + Android app) that the android workflow's `site`
# job pushes; that branch has its own netlify.toml and Netlify builds nothing
# for it. THIS file only drives the Deploy Preview each pull request gets:
# Netlify installs root dependencies (npm workspaces) and builds only the game
# client (no Android app in previews, so no "Get the Android app" button).
[build]
  command = "npm run build -w @overclock/client"
  publish = "apps/client/dist"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH = "/"
  # Sprint 6: "Play online" on the Netlify copy. Netlify can't read GitHub's
  # repository variables, so the team writes the service address here once the
  # owner's Cloudflare account exists (same value as the OVERCLOCK_SERVER_URL
  # variable, e.g. "wss://overclock.<subdomain>.workers.dev"). Empty = not set up.
  OVERCLOCK_SERVER_URL = "wss://overclock.patrickmedaugh.workers.dev"
