name: server

# Sprint 6 (S-06-4): deploys the online service (apps/server) to the owner's
# Cloudflare account (free plan) on every push to main or a sprint branch, the
# same way the web link and the app update. Then /health must report this
# commit, which proves the service updated itself.
#
# Until the owner has added the secrets (apps/server/README.md, "For the
# owner"), the job prints a notice and succeeds: nothing to deploy to yet.

on:
  push:
    branches: [main, 'sprint-[0-9][0-9]']
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled half-way; the last push wins.
concurrency:
  group: server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERVER_URL: ${{ vars.OVERCLOCK_SERVER_URL }}
    steps:
      - name: Cloudflare set up yet?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Online service not deployed::The Cloudflare secrets are not set yet (see apps/server/README.md, 'For the owner'). Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.ready.outputs.ok == 'true'

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        working-directory: apps/server
        run: npx wrangler deploy --var "BUILD:$GITHUB_SHA"

      - name: /health reports this commit
        if: steps.ready.outputs.ok == 'true'
        run: |
          set -euo pipefail
          if [ -z "$SERVER_URL" ]; then
            echo "::error::Repository variable OVERCLOCK_SERVER_URL is not set (wss://overclock.<your-subdomain>.workers.dev)."
            exit 1
          fi
          HEALTH="$(echo "$SERVER_URL" | sed -e 's#^wss://#https://#' -e 's#^ws://#http://#' -e 's#/*$##')/health"
          for i in $(seq 1 30); do
            BODY=$(curl -fsS "$HEALTH" || true)
            echo "try $i: $BODY"
            if echo "$BODY" | grep -q "\"build\":\"$GITHUB_SHA\""; then
              echo "The online service runs commit $GITHUB_SHA."
              exit 0
            fi
            sleep 5
          done
          echo "::error::$HEALTH never reported build $GITHUB_SHA"
          exit 1
