name: android

# Builds the OVERCLOCK Android app (apps/android) and publishes it on the
# repo's Releases page (owner answer A, Sprint 4): one rolling release per
# branch, tag `app-<branch>`, updated by every build. `main` is the "Latest"
# release; `sprint-*` branches are pre-releases. The checks below fail the job
# if the APK is missing, signed with another key, or has the wrong id, name or
# orientation, or if its web bundle has the test hook / rotate prompt / URLs.
#
# Two jobs (S-05-4): `build` may be cancelled by a newer push (it touches
# nothing public); `publish` is never cancelled half-way, and
# scripts/publish-release.mjs uploads the new APK before removing the old one,
# so the release always has an APK. Any GitHub error fails the run.

on:
  push:
    # Only main and the sprint branches themselves (sprint-04, sprint-05, ...):
    # helper branches such as sprint-04-ui or sprint-05-proposal must not
    # publish their own app releases (architect review, Sprint 4).
    branches: [main, 'sprint-[0-9][0-9]']
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Certificate SHA-256 of apps/android/keystore/overclock.jks (never changes:
  # a new key would stop updates installing over the old app).
  CERT_SHA256: 510531217c7bbbc01172c811bc7c5a24d6a5922e2c495c4fe871fc26d4deaa99
  APP_ID: app.overclock.game
  BUILD_TOOLS: 36.0.0

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push makes this build pointless: stop it.
    concurrency:
      group: android-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      build_time: ${{ steps.names.outputs.build_time }}
      version_code: ${{ steps.names.outputs.version_code }}
      branch: ${{ steps.names.outputs.branch }}
      tag: ${{ steps.names.outputs.tag }}
      apk_name: ${{ steps.names.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Capacitor 8 CLI needs Node 22 or newer (the web build is fine on 20).
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (platform 36, build-tools)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;${BUILD_TOOLS}" > /dev/null
          echo "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" >> "$GITHUB_PATH"

      - name: Build time and names (set once, used everywhere)
        id: names
        run: |
          NOW=$(date -u +%s)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          # Run number and attempt make every APK name unique, so a new upload never replaces the one people may be downloading.
          APK_NAME="overclock-$BRANCH-$(date -u -d "@$NOW" '+%Y%m%d-%H%M')-b${{ github.run_number }}.${{ github.run_attempt }}.apk"
          BUILD_TIME="$(date -u -d "@$NOW" '+%Y-%m-%d %H:%M UTC')"
          {
            echo "OVERCLOCK_BUILD_TIME=$BUILD_TIME"
            echo "OVERCLOCK_VERSION_CODE=${{ github.run_number }}"
            echo "BRANCH=$BRANCH"
            echo "TAG=app-$BRANCH"
            echo "APK_NAME=$APK_NAME"
          } >> "$GITHUB_ENV"
          {
            echo "build_time=$BUILD_TIME"
            echo "version_code=${{ github.run_number }}"
            echo "branch=$BRANCH"
            echo "tag=app-$BRANCH"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

      # Android web build + bundle check + cap sync (apps/android/package.json).
      # Sprint 6: the online service (repo variable; unset = "isn't set up yet") and the
      # web game's address for Share links sent from the app.
      - run: npm run sync --workspace @overclock/android
        env:
          OVERCLOCK_SERVER_URL: ${{ vars.OVERCLOCK_SERVER_URL }}
          OVERCLOCK_WEB_URL: ${{ vars.OVERCLOCK_WEB_URL || 'https://patrickmedaugh.github.io/overclock/' }}

      - name: Build the APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check the APK
        env:
          # The bundle check allows exactly this origin in the app's CSP.
          OVERCLOCK_SERVER_URL: ${{ vars.OVERCLOCK_SERVER_URL }}
        run: |
          set -euo pipefail
          APK=apps/android/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK missing: $APK"; exit 1; }

          echo "--- signature"
          apksigner verify --print-certs "$APK" | tee certs.txt
          SHA=$(grep -m1 'certificate SHA-256 digest' certs.txt | awk '{print $NF}')
          if [ "$SHA" != "$CERT_SHA256" ]; then echo "::error::signed with $SHA, expected $CERT_SHA256"; exit 1; fi

          echo "--- badging"
          aapt2 dump badging "$APK" | tee badging.txt | head -5
          grep -q "package: name='$APP_ID'" badging.txt || { echo "::error::package id is not $APP_ID"; exit 1; }
          grep -q "versionCode='$OVERCLOCK_VERSION_CODE'" badging.txt || { echo "::error::versionCode is not $OVERCLOCK_VERSION_CODE"; exit 1; }
          grep -q "application-label:'OVERCLOCK'" badging.txt || { echo "::error::app label is not OVERCLOCK"; exit 1; }

          echo "--- orientation"
          aapt2 dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          # sensorLandscape = 6
          grep -q 'screenOrientation(0x0101001e)=6' manifest.txt || { grep screenOrientation manifest.txt || true; echo "::error::activity is not sensorLandscape"; exit 1; }

          echo "--- web bundle inside the APK"
          rm -rf apk-contents && mkdir apk-contents
          unzip -q "$APK" 'assets/public/*' -d apk-contents
          node apps/client/scripts/check-android-bundle.mjs apk-contents/assets/public

          cp "$APK" "$APK_NAME"
          ls -l "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One publish per branch at a time, and never cancelled half-way (a newer
    # one waits; an older one still waiting is replaced by the newer).
    concurrency:
      group: android-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      BUILD_TIME: ${{ needs.build.outputs.build_time }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      BRANCH: ${{ needs.build.outputs.branch }}
      TAG: ${{ needs.build.outputs.tag }}
      APK_NAME: ${{ needs.build.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/android/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$APK_NAME" || { echo "::error::APK missing: $APK_NAME"; exit 1; }
          if [ "$GITHUB_REF_NAME" = "main" ]; then LABEL="the main version"; else LABEL="sprint branch $GITHUB_REF_NAME"; fi
          cat > notes.md <<EOF
          The OVERCLOCK app for Android, built from $LABEL on **$BUILD_TIME**.
          The same date shows small in a corner of the game board, so you can tell you have this one.

          **To install on your phone**
          1. Open this page on the phone and tap **$APK_NAME** below (under "Assets").
          2. The first time, Android asks to allow installs from your browser: tap **Settings**, turn on **Allow from this source**, then go back.
          3. Tap **Install**. If Android warns the app is from an unknown developer, tap **Install anyway** (it is ours, not from the Play Store).
          4. Open **OVERCLOCK** from your apps.

          Already have the app? Installing this file updates it in place. If Android ever says "App not installed", uninstall the old app first (games are not saved yet, so you lose nothing).

          Build $VERSION_CODE · commit ${GITHUB_SHA::7}
          EOF
          APK="$APK_NAME" NOTES_FILE=notes.md TITLE="OVERCLOCK app — $BRANCH — built $BUILD_TIME" \
            node apps/android/scripts/publish-release.mjs
