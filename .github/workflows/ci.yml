name: ci

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job ids/names are stable: branch protection requires `checks` and `e2e`.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # S-04-1/S-04-2: the Android app's web bundle builds and has no test hook,
      # no rotate prompt and no internet URLs (scripts/check-android-bundle.mjs).
      - run: npm run build:android --workspace apps/client
      - run: npm run check:android --workspace apps/client

  # The screen tests are split into 4 pieces that run at the same time
  # (one full pass took ~22 min on one machine). DECISIONS 2026-11-13.
  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        if: hashFiles('apps/client/package.json') != ''
        # Ubuntu mirrors are sometimes unreachable from runners; the runner image
        # already has Chromium's system libraries, so fall back to browser-only.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e --workspace apps/client -- --shard=${{ matrix.shard }}/4
      - name: Upload Playwright report
        if: failure() && hashFiles('apps/client/playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/client/playwright-report
          retention-days: 7

  # Keeps the required check named `e2e`: green only if every shard is green.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: All e2e shards passed
        run: |
          echo "shards: ${{ needs.e2e-shard.result }}"
          test "${{ needs.e2e-shard.result }}" = "success"

  # S-03-6: the End turn double-tap-guard e2e must still fail when the guard is
  # broken (guard 0ms, judged by handling time, check removed). Builds each
  # broken version in a temporary worktree and runs the guard specs against it.
  guard-mutation:
    name: guard-mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:guard-mutation
