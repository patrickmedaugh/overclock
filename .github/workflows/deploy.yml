name: deploy

# Publishes the client to GitHub Pages: https://<owner>.github.io/overclock/
# Every push to main or a sprint-* branch redeploys the same URL, so the
# owner's demo link always shows the newest build (last deploy wins).
# Repo setting needed once: Settings > Pages > Source = "GitHub Actions", and
# the `github-pages` environment must allow the `sprint-*` branches.

on:
  push:
    branches: [main, 'sprint-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Vite production build uses base '/overclock/' (apps/client/vite.config.ts).
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
