<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- OVERCLOCK app icon, drawn by the team (no copied art). Adaptive-icon
       foreground: everything stays inside the central 66x66 safe zone. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="54,23 80,38 80,70 54,85 28,70 28,38" fill="none" stroke="#19e6ff" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="54,36 68,44 68,64 54,72 40,64 40,44" fill="#ff2bd6" fill-opacity="0.35" stroke="#ff2bd6" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M54,44 L54,54 L61,58" fill="none" stroke="#e8f6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="54" cy="54" r="2.6" fill="#e8f6ff"/>
  </g>
</svg>
