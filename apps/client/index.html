<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <!-- Home-screen launch opens full-screen (Chrome via the manifest, iOS Safari via these tags). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERCLOCK" />
    <!-- Relative paths so the build works under any base path (/overclock/ on Pages, / on Netlify). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Project OVERCLOCK</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07060d; }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app, #app canvas { position: fixed; inset: 0; display: block; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #19e6ff; font: 700 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px;
      }
      /* Phones are played sideways: upright, this covers the board (src/device.ts). */
      #rotate {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 22px;
        align-items: center; justify-content: center; background: #07060d; color: #e8f6ff;
        font: 700 20px "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif; text-align: center;
        padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
      }
      #rotate[hidden] { display: none; }
      #rotate small { display: block; margin-top: 6px; font-size: 14px; font-weight: 400; color: #7d8aa3; }
      #rotate svg { width: 96px; height: 96px; overflow: visible; animation: oc-turn 1.8s ease-in-out infinite; }
      @keyframes oc-turn { 0%, 25% { transform: rotate(0deg); } 55%, 100% { transform: rotate(-90deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; transform: rotate(-90deg); } }
      /* Read by src/safeArea.ts: the browser fills these paddings with the
         notch / status bar / gesture bar sizes. Never visible. */
      #safe-probe {
        position: fixed; inset: 0; visibility: hidden; pointer-events: none; box-sizing: border-box;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="boot">BOOTING…</div>
    <div id="rotate" role="alert" hidden>
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="30" y="8" width="36" height="80" rx="7" fill="none" stroke="#19e6ff" stroke-width="4" />
        <rect x="42" y="14" width="12" height="3" rx="1.5" fill="#19e6ff" />
        <circle cx="48" cy="79" r="3" fill="#ff2bd6" />
      </svg>
      <div>Turn your phone sideways<small>The game is played with the phone held sideways.</small></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
