<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060d" />
    <!-- Home-screen launch opens full-screen (Chrome via the manifest, iOS Safari via these tags). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OVERCLOCK" />
    <!-- Relative paths so the build works under any base path (/overclock/ on Pages, / on Netlify). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>Project OVERCLOCK</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #07060d; }
      body {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #app, #app canvas { position: fixed; inset: 0; display: block; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #19e6ff; font: 700 14px ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px;
      }
      /* Read by src/safeArea.ts: the browser fills these paddings with the
         notch / status bar / gesture bar sizes. Never visible. In the Android
         app, Capacitor's SystemBars plugin also sets --safe-area-inset-* (for
         WebViews whose env() values are unreliable); the larger one wins. */
      #safe-probe {
        position: fixed; inset: 0; visibility: hidden; pointer-events: none; box-sizing: border-box;
        padding: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px))
          max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px))
          max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px))
          max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
      }
      /* rotate:start */
      /* Phones are played sideways. An upright phone (portrait, touch, short
         side under 600px) gets this prompt over the game, which keeps running
         underneath: rotating back shows the same board. Tablets and desktop
         windows never see it. Pure CSS, so it reacts the instant the phone turns. */
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: radial-gradient(circle at 50% 40%, #120a1f 0%, #07060d 70%);
        color: #e8f6ff; text-align: center;
        font: 700 20px "Segoe UI", Roboto, "Helvetica Neue", Arial, system-ui, sans-serif; letter-spacing: 1px;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
      #rotate p { margin: 0 24px; }
      #rotate .phone {
        width: 46px; height: 80px; border: 3px solid #19e6ff; border-radius: 9px; position: relative;
        box-shadow: 0 0 14px rgba(25, 230, 255, 0.55), inset 0 0 10px rgba(25, 230, 255, 0.25);
        animation: rotate-hint 1.8s ease-in-out infinite;
      }
      #rotate .phone::after {
        content: ''; position: absolute; left: 50%; bottom: 6px; width: 12px; height: 3px;
        margin-left: -6px; border-radius: 2px; background: #ff2bd6;
      }
      @keyframes rotate-hint {
        0%, 20% { transform: rotate(0deg); }
        55%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .phone { animation: none; transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 599.98px) {
        #rotate { display: flex; }
      }
      /* rotate:end */
    </style>
  </head>
  <body>
    <div id="safe-probe" aria-hidden="true"></div>
    <div id="boot">BOOTING…</div>
    <div id="app"></div>
    <!-- rotate:start -->
    <div id="rotate" role="alert">
      <div class="phone" aria-hidden="true"></div>
      <p>Turn your phone sideways</p>
    </div>
    <!-- rotate:end -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
